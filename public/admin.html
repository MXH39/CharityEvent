<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Manage Charity Events</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container{
            max-width: 900px;
            margin:30px auto;
            padding:0 20px;
        }
        .form-block{
            background:#fff;
            padding:24px;
            border-radius:10px;
            margin-bottom:30px;
            border:1px solid #ddd;
        }
        .row{
            margin:12px 0;
        }
        label{
            display:block;
            margin-bottom:4px;
            font-weight:bold;
        }
        input, select, textarea{
            width:100%;
            padding:8px;
            border:1px solid #ccc;
            border-radius:6px;
        }
        .delete-area{
            background:#ffe9e9;
        }
        .msg-success{
            color:#208036;
        }
        .msg-error{
            color:#c41e1e;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="search.html">Search Events</a>
        <a href="admin.html">Admin Manage</a>
    </div>
    <div class="admin-container">
        <!-- 新增活动表单 POST -->
        <div class="form-block">
            <h2>Add New Charity Event (POST)</h2>
            <div class="row">
                <label>Event Name</label>
                <input id="event_name" type="text" placeholder="e.g. Autumn Marathon">
            </div>
            <div class="row">
                <label>Description</label>
                <textarea id="event_desc" rows="3"></textarea>
            </div>
            <div class="row">
                <label>Event Date</label>
                <input id="event_date" type="date">
            </div>
            <div class="row">
                <label>Location</label>
                <input id="event_loc" type="text">
            </div>
            <div class="row">
    <label>Event Category</label>
    <select id="cat_id">
        <option value="1">1 - Fun Run</option>
        <option value="2">2 - Gala Dinner</option>
        <option value="3">3 - Silent Auction</option>
        <option value="4">4 - Charity Concert</option>
    </select>
</div>
            <div class="row">
                <label>Ticket Price</label>
                <input id="ticket_price" type="number" step="0.01">
            </div>
            <div class="row">
                <label>Charity Goal</label>
                <input id="goal" type="number">
            </div>
            <div class="row">
                <label>Current Progress</label>
                <input id="progress" type="number">
            </div>
            <button onclick="addNewEvent()">Create New Event</button>
            <div id="addMsg"></div>
        </div>

        <!-- 删除活动区域 DELETE -->
        <div class="form-block delete-area">
            <h2>Delete Event (DELETE)</h2>
            <div class="row">
                <label>Input Event ID to Delete</label>
                <input id="del_id" type="number" placeholder="e.g. 9">
            </div>
            <button onclick="deleteEvent()" style="background:#c41e1e">Delete This Event</button>
            <div id="delMsg"></div>
        </div>
    </div>

<script>
// POST 新增活动
async function addNewEvent(){
    const payload = {
        event_name: document.getElementById("event_name").value,
        event_description: document.getElementById("event_desc").value,
        event_date: document.getElementById("event_date").value,
        event_location: document.getElementById("event_loc").value,
        cat_id: Number(document.getElementById("cat_id").value),
        ticket_price: Number(document.getElementById("ticket_price").value),
        charity_goal: Number(document.getElementById("goal").value),
        charity_progress: Number(document.getElementById("progress").value)
    }
    try{
        const res = await fetch("/api/events", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        })
        const data = await res.json();
        if(res.ok){
            document.getElementById("addMsg").className="msg-success";
            document.getElementById("addMsg").innerText = data.msg + " New Event ID: " + data.newId;
        }else{
            document.getElementById("addMsg").className="msg-error";
            document.getElementById("addMsg").innerText = data.msg;
        }
    }catch(err){
        document.getElementById("addMsg").className="msg-error";
        document.getElementById("addMsg").innerText = "Request failed, check server & database";
    }
}

// DELETE 删除活动
async function deleteEvent(){
    const delId = document.getElementById("del_id").value;
    if(!delId){
        document.getElementById("delMsg").innerText = "Please input event id";
        return;
    }
    try{
        const res = await fetch(`/api/events/${delId}`,{
            method:"DELETE"
        })
        const data = await res.json();
        if(res.ok){
            document.getElementById("delMsg").className="msg-success";
            document.getElementById("delMsg").innerText = data.msg;
        }else{
            document.getElementById("delMsg").className="msg-error";
            document.getElementById("delMsg").innerText = data.msg;
        }
    }catch(err){
        document.getElementById("delMsg").className="msg-error";
        document.getElementById("delMsg").innerText = "Delete request error";
    }
}
</script>
</body>
</html>
